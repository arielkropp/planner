<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2F84CE" />
      <stop offset="100%" stop-color="#174A78" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0E2D4A" flood-opacity="0.35" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  
    <g filter="url(#glow)">
      <!-- Retractable handle -->
      <path d="M 212 178 V 122 C 212 108 223 96 238 96 H 274 C 289 96 300 108 300 122 V 178"
            fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Wheels -->
      <circle cx="196" cy="424" r="18" fill="#FFFFFF"/>
      <circle cx="316" cy="424" r="18" fill="#FFFFFF"/>
      <!-- Suitcase body -->
      <rect x="156" y="178" width="200" height="234" rx="36"
            fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Suitcase horizontal bands -->
      <line x1="156" y1="260" x2="356" y2="260" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round"/>
      <line x1="156" y1="330" x2="356" y2="330" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round"/>
      <!-- Center latch -->
      <rect x="238" y="246" width="36" height="28" rx="8" fill="#FFFFFF"/>
    </g>
</svg>
