<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trip Planner</title>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#2266A3">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#101317">
<meta name="theme-color" content="#2266A3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Planner">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
  (function() {
    try {
      var saved = localStorage.getItem("arg-theme");
      var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      var theme = saved || (prefersDark ? "dark" : "light");
      document.documentElement.dataset.theme = theme;
    } catch(e) {}
  })();
</script>
<link rel="stylesheet" href="css/shared/main.css">
<!-- The media queries pick the right stylesheet for the first paint; js/boot.js takes over from there -->
<link rel="stylesheet" href="css/desktop/main.css" media="(min-width: 761px)" data-platform-styles="desktop">
<link rel="stylesheet" href="css/mobile/main.css" media="(max-width: 760px)" data-platform-styles="mobile">
<script type="module" src="js/boot.js"></script>
</head>

<div id="app"></div>

<!-- Each platform owns its markup; js/boot.js clones the one that matches the viewport into #app -->
<template id="platform-desktop">
<div class="app">
  <aside class="sidebar">
    <nav aria-label="Screens">
      <a class="nav-link" href="#itinerary"><svg class="i" aria-hidden="true"><use href="#i-calendar-days"/></svg><span>Itinerary</span></a>
      <a class="nav-link" href="#packing"><svg class="i" aria-hidden="true"><use href="#i-luggage"/></svg><span>Packing</span></a>
      <a class="nav-link" href="#work"><svg class="i" aria-hidden="true"><use href="#i-laptop"/></svg><span>Work log</span></a>
      <a class="nav-link" href="#settings" aria-label="Settings"><svg class="i" aria-hidden="true"><use href="#i-settings"/></svg><span>Settings</span></a>
    </nav>
    <p class="save-note" id="saveStatus" role="status">Saved in this browser only. Back up before switching browsers or devices.</p>
  </aside>

  <main>
    <h1 class="sr-only">Trip Planner</h1>
    <p class="notice" id="storageError" role="alert" hidden></p>
    <section data-screen="itinerary" aria-label="Itinerary">
      <div class="itinerary-toolbar">
        <div class="itinerary-switcher">
          <div class="seg" id="itineraryViews" role="group" aria-label="Itinerary view">
            <span class="seg-lens" id="itineraryLens" aria-hidden="true"></span>
            <button type="button" data-itinerary-view="schedule" aria-pressed="true">Schedule</button>
            <button type="button" data-itinerary-view="week" aria-pressed="false">Week</button>
            <button type="button" data-itinerary-view="month" aria-pressed="false">Month</button>
          </div>
          <div class="itinerary-actions">
            <button class="icon-btn tonal" id="theme" type="button" aria-label="Toggle dark mode" title="Toggle dark mode"><svg class="i" aria-hidden="true"><use href="#i-moon"/></svg></button>
          </div>
        </div>
      </div>

      <div id="scheduleView">
        <div id="agendaList"></div>
      </div>

      <div id="calendarView" hidden>
        <div class="tv-bar" id="tvBar" hidden>
          <button class="icon-btn" id="tvPrev" type="button" aria-label="Previous"><svg class="i" aria-hidden="true"><use href="#i-left"/></svg></button>
          <h2 class="tv-title" id="tvTitle" tabindex="-1" aria-live="polite"></h2>
          <button class="icon-btn" id="tvNext" type="button" aria-label="Next"><svg class="i" aria-hidden="true"><use href="#i-right"/></svg></button>
        </div>
        <div class="cal" id="tvBody"></div>
      </div>

      <button class="fab" id="addItem" type="button" aria-label="Add itinerary item" title="Add itinerary item"><svg class="i" aria-hidden="true"><use href="#i-plus"/></svg></button>
    </section>

    <section data-screen="packing" aria-label="Packing list" hidden>
      <div class="itinerary-toolbar">
        <div class="itinerary-switcher">
          <div class="seg" id="packViews" role="group" aria-label="Packing view">
            <span class="seg-lens" id="packLens" aria-hidden="true"></span>
            <button type="button" data-pack-view="all" aria-pressed="true">All</button>
            <button type="button" data-pack-view="to-buy" aria-pressed="false">To buy</button>
            <button type="button" data-pack-view="to-pack" aria-pressed="false">To pack</button>
          </div>
          <div class="itinerary-actions">
            <button class="icon-btn tonal" id="packTheme" type="button" aria-label="Toggle dark mode" title="Toggle dark mode"><svg class="i" aria-hidden="true"><use href="#i-moon"/></svg></button>
          </div>
        </div>
      </div>

      <div class="pack-card">
        <div id="packingContent" class="pack-list"></div>
      </div>

      <div class="pack-quick-add-box" id="packQuickAddBox" hidden>
        <form id="packQuickAddForm" class="pack-quick-add-form" autocomplete="off">
          <input type="text" id="packQuickAddInput" class="pack-quick-add-input" placeholder="Quick add item..." maxlength="200" autocomplete="off" aria-label="Item title">
          <button type="submit" id="packQuickAddSave" class="btn primary pack-quick-add-save">Save</button>
        </form>
      </div>

      <div class="pack-fab-group">
        <button class="fab fab-quick" id="quickAddPackItem" type="button" aria-label="Quick add packing item" title="Quick add">
          <svg class="i" aria-hidden="true"><use href="#i-zap-plus"/></svg>
        </button>
        <button class="fab" id="addPackItem" type="button" aria-label="Add packing item" title="Add packing item">
          <svg class="i" aria-hidden="true"><use href="#i-plus"/></svg>
        </button>
      </div>
    </section>

    <section data-screen="work" aria-label="Work log" hidden>
      <div class="itinerary-toolbar">
        <div class="itinerary-switcher">
          <div class="work-stat-capsule" role="status" aria-label="Work log hours summary">
            <span class="work-stat-pill">Logged <strong id="workLogged">0</strong> hrs</span>
            <span class="work-stat-divider" aria-hidden="true"></span>
            <span class="work-stat-pill">Target <strong id="workTarget">42</strong> hrs</span>
          </div>
          <div class="itinerary-actions">
            <button class="icon-btn tonal" id="workTheme" type="button" aria-label="Toggle dark mode" title="Toggle dark mode"><svg class="i" aria-hidden="true"><use href="#i-moon"/></svg></button>
          </div>
        </div>
      </div>

      <div class="work-card">
        <div class="work-header-row">
          <div class="work-col-desc">Description</div>
          <div class="work-col-date">Date</div>
          <div class="work-col-hrs">Hrs</div>
        </div>
        <div id="workList" class="work-list"></div>
      </div>

      <button class="fab" id="addWorkItem" type="button" aria-label="Add work log entry" title="Add work log entry">
        <svg class="i" aria-hidden="true"><use href="#i-plus"/></svg>
      </button>
    </section>

    <section data-screen="settings" aria-label="Settings" hidden>
      <div class="itinerary-toolbar">
        <div class="itinerary-switcher">
          <div class="itinerary-actions">
            <button class="icon-btn tonal" id="settingsTheme" type="button" aria-label="Toggle dark mode" title="Toggle dark mode"><svg class="i" aria-hidden="true"><use href="#i-moon"/></svg></button>
          </div>
        </div>
      </div>

      <div class="settings-screen">
        <div class="settings-group">
          <h2 class="settings-group-label">Trips</h2>
          <div class="settings-card">
            <div id="tripsList"></div>
            <div class="settings-divider" id="tripsDivider" aria-hidden="true" hidden></div>
            <button type="button" class="settings-row" id="addTripBtn">
              <div class="settings-icon-well"><svg class="i" aria-hidden="true"><use href="#i-plus"/></svg></div>
              <div class="settings-text">
                <div class="settings-name">Add trip</div>
                <div class="settings-desc" id="addTripDesc">Create a new trip to track itinerary, packing list and work log</div>
              </div>
              <div class="settings-chevron"><svg class="i sm" aria-hidden="true"><use href="#i-right"/></svg></div>
            </button>
          </div>
        </div>

        <div class="settings-group">
          <h2 class="settings-group-label">Work Log</h2>
          <div class="settings-card">
            <div class="settings-row static-row">
              <div class="settings-icon-well"><svg class="i" aria-hidden="true"><use href="#i-laptop"/></svg></div>
              <div class="settings-text">
                <label class="settings-name" for="workTargetInput">Work log target</label>
                <div class="settings-desc">Target hours for active trip</div>
              </div>
              <div class="settings-input-wrap">
                <input id="workTargetInput" type="number" min="0" max="999" step="any" class="settings-number-input" aria-label="Work log target hours">
                <span class="settings-unit">hrs</span>
              </div>
            </div>
          </div>
        </div>

        <div class="settings-group">
          <h2 class="settings-group-label">Data &amp; Export</h2>
          <div class="settings-card">
            <button type="button" class="settings-row" id="exportIcs">
              <div class="settings-icon-well"><svg class="i" aria-hidden="true"><use href="#i-calendar-download-02"/></svg></div>
              <div class="settings-text">
                <div class="settings-name">Download ICS</div>
                <div class="settings-desc">Export itinerary to calendar (.ics)</div>
              </div>
              <div class="settings-chevron"><svg class="i sm" aria-hidden="true"><use href="#i-download"/></svg></div>
            </button>

            <div class="settings-divider" aria-hidden="true"></div>

            <button type="button" class="settings-row" id="export">
              <div class="settings-icon-well"><svg class="i" aria-hidden="true"><use href="#i-download"/></svg></div>
              <div class="settings-text">
                <div class="settings-name">Download data</div>
                <div class="settings-desc">Back up planner data as a JSON file</div>
              </div>
              <div class="settings-chevron"><svg class="i sm" aria-hidden="true"><use href="#i-right"/></svg></div>
            </button>

            <div class="settings-divider" aria-hidden="true"></div>

            <button type="button" class="settings-row" id="restore">
              <div class="settings-icon-well"><svg class="i" aria-hidden="true"><use href="#i-upload"/></svg></div>
              <div class="settings-text">
                <div class="settings-name">Upload data</div>
                <div class="settings-desc">Restore planner data from a backup JSON file</div>
              </div>
              <div class="settings-chevron"><svg class="i sm" aria-hidden="true"><use href="#i-right"/></svg></div>
            </button>
            <input id="import" type="file" accept=".json,application/json" hidden>

            <div class="settings-divider" aria-hidden="true"></div>

            <button type="button" class="settings-row" id="openRatesUtil">
              <div class="settings-icon-well"><svg class="i" aria-hidden="true"><use href="#i-currency"/></svg></div>
              <div class="settings-text">
                <div class="settings-name">Budget &amp; currency</div>
                <div class="settings-desc">Set base currency and conversion rates</div>
              </div>
              <div class="settings-chevron"><svg class="i sm" aria-hidden="true"><use href="#i-right"/></svg></div>
            </button>
          </div>
        </div>

        <div class="settings-info-card">
          <p class="settings-info-text">Data is stored in this browser only. Export a backup before switching browsers or devices.</p>
        </div>
      </div>
    </section>

  </main>
</div>

<dialog id="itemFullscreenDialog" class="fs-item-dialog" aria-labelledby="fsDialogTitle" aria-modal="true">
  <form id="fsItemForm" novalidate>
    <div class="fs-header">
      <button type="button" class="icon-btn" data-close id="fsClose" aria-label="Close" title="Close"><svg class="i" aria-hidden="true"><use href="#i-x"/></svg></button>
      <div class="fs-handle" aria-hidden="true"></div>

            <div class="settings-divider" aria-hidden="true"></div>

            <button type="button" class="settings-row" id="export">
              <div class="settings-icon-well"><svg class="i" aria-hidden="true"><use href="#i-download"/></svg></div>
              <div class="settings-text">
                <div class="settings-name">Download data</div>
                <div class="settings-desc">Back up planner data as a JSON file</div>
              </div>
              <div class="settings-chevron"><svg class="i sm" aria-hidden="true"><use href="#i-right"/></svg></div>
            </button>

            <div class="settings-divider" aria-hidden="true"></div>

            <button type="button" class="settings-row" id="restore">
              <div class="settings-icon-well"><svg class="i" aria-hidden="true"><use href="#i-upload"/></svg></div>
              <div class="settings-text">
                <div class="settings-name">Upload data</div>
                <div class="settings-desc">Restore planner data from a backup JSON file</div>
              </div>
              <div class="settings-chevron"><svg class="i sm" aria-hidden="true"><use href="#i-right"/></svg></div>
            </button>
            <input id="import" type="file" accept=".json,application/json" hidden>

            <div class="settings-divider" aria-hidden="true"></div>

            <button type="button" class="settings-row" id="openRatesUtil">
              <div class="settings-icon-well"><svg class="i" aria-hidden="true"><use href="#i-currency"/></svg></div>
              <div class="settings-text">
                <div class="settings-name">Budget &amp; currency</div>
                <div class="settings-desc">Set base currency and conversion rates</div>
              </div>
              <div class="settings-chevron"><svg class="i sm" aria-hidden="true"><use href="#i-right"/></svg></div>
            </button>
          </div>
        </div>

        <div class="settings-info-card">
          <p class="settings-info-text">Data is stored in this browser only. Export a backup before switching browsers or devices.</p>
        </div>
      </div>
    </section>

  </main>
</div>

<dialog id="itemFullscreenDialog" class="fs-item-dialog" aria-labelledby="fsDialogTitle" aria-modal="true">
  <form id="fsItemForm" novalidate>
    <div class="fs-header">
      <button type="button" class="icon-btn" data-close id="fsClose" aria-label="Close" title="Close"><svg class="i" aria-hidden="true"><use href="#i-x"/></svg></button>
      <div class="fs-handle" aria-hidden="true"></div>
      <h2 id="fsDialogTitle" class="sr-only">Item details</h2>
      <div class="fs-header-actions" id="fsViewActions" hidden>
        <button type="button" class="icon-btn danger" id="fsViewDelete" aria-label="Delete item" title="Delete item"><svg class="i" aria-hidden="true"><use href="#i-trash"/></svg></button>
        <button type="button" class="fs-edit-btn" id="fsEditBtn"><svg class="i sm" aria-hidden="true"><use href="#i-pencil"/></svg>Edit</button>
      </div>
      <div class="fs-header-actions" id="fsEditActions">
        <button type="button" class="icon-btn danger" id="fsDelete" aria-label="Delete item" title="Delete item" hidden><svg class="i" aria-hidden="true"><use href="#i-trash"/></svg></button>
        <button type="submit" class="fs-save-btn" id="fsSave">Save</button>
      </div>
    </div>

    <!-- Read-Only View Mode -->
    <div class="fs-body" id="fsViewBody" hidden>
      <div class="fs-card fs-view-hero">
        <div class="fs-view-badges" id="fsViewBadges"></div>
        <h3 class="fs-view-title" id="fsViewTitle"></h3>
      </div>

      <div class="fs-group">
        <h3 class="fs-group-label">Schedule</h3>
        <div class="fs-card fs-view-list">
          <div class="fs-view-row" id="fsViewStartRow">
            <div class="fs-view-icon" aria-hidden="true"><svg class="i"><use href="#i-calendar-days"/></svg></div>
            <div class="fs-view-text">
              <div class="fs-view-meta">Start</div>
              <div class="fs-view-val" id="fsViewStartText"></div>
              <div class="fs-view-sub" id="fsViewStartTz"></div>
            </div>
          </div>

          <div class="fs-view-divider" id="fsViewEndDivider" hidden aria-hidden="true"></div>

          <div class="fs-view-row" id="fsViewEndRow" hidden>
            <div class="fs-view-icon" aria-hidden="true"><svg class="i"><use href="#i-clock"/></svg></div>
            <div class="fs-view-text">
              <div class="fs-view-meta">End</div>
              <div class="fs-view-val" id="fsViewEndText"></div>
              <div class="fs-view-sub" id="fsViewEndTz"></div>
            </div>
          </div>

          <div class="fs-view-duration" id="fsViewDuration" hidden></div>
        </div>
      </div>

      <div class="fs-group" id="fsViewDetailsGroup">
        <h3 class="fs-group-label">Details</h3>
        <div class="fs-card fs-view-list">
          <div class="fs-view-row" id="fsViewCostRow" hidden>
            <div class="fs-view-icon" aria-hidden="true"><svg class="i"><use href="#i-currency"/></svg></div>
            <div class="fs-view-text">
              <div class="fs-view-meta">Cost</div>
              <div class="fs-view-val" id="fsViewCostText"></div>
            </div>
          </div>

          <div class="fs-view-divider" id="fsViewDetailsDivider" hidden aria-hidden="true"></div>

          <div class="fs-view-row" id="fsViewNotesRow" hidden>
            <div class="fs-view-icon" aria-hidden="true"><svg class="i"><use href="#i-sticky-note"/></svg></div>
            <div class="fs-view-text">
              <div class="fs-view-meta">Notes</div>
              <div class="fs-view-notes" id="fsViewNotesText"></div>
            </div>
          </div>

          <div class="fs-view-empty" id="fsViewNoDetails" hidden>No cost or notes added.</div>
        </div>
      </div>
    </div>

    <!-- Edit / Create Mode -->
    <div class="fs-body" id="fsEditBody">
      <!-- Title, Type & Status Card -->
      <div class="fs-card fs-hero-card">
        <div class="fs-title-wrap">
          <label for="fsTitle" class="sr-only">Item title</label>
          <input id="fsTitle" class="fs-title-input" required maxlength="200" autocomplete="off" placeholder="Add title..." aria-label="Item title">
        </div>
        <div class="fs-card-divider" aria-hidden="true"></div>
        <div class="fs-chip-section">
          <span class="fs-label">Type</span>
          <div class="chips" id="fsTypes" role="radiogroup" aria-label="Type"></div>
        </div>
        <div class="fs-chip-section">
          <span class="fs-label">Status</span>
          <div class="chips" id="fsStatuses" role="radiogroup" aria-label="Status"></div>
        </div>
      </div>

      <!-- Schedule Card (Stacked Start & End) -->
      <div class="fs-group">
        <h3 class="fs-group-label">Schedule</h3>
        <div class="fs-card fs-schedule-card">
          <div class="field">
            <label for="fsStartDate">Start <span class="req" aria-hidden="true">*</span></label>
            <div class="dt-box fs-dt-box">
              <input type="date" id="fsStartDate" required aria-label="Start date">
              <div class="sep" aria-hidden="true"></div>
              <input type="time" id="fsStartTime" aria-label="Start time">
              <div class="sep" aria-hidden="true"></div>
              <button type="button" class="dtz-wrap" id="fsTzBtn" aria-label="Start timezone" title="Start timezone">
                <span class="dtz-badge" id="fsTzBadge" aria-hidden="true">TZ</span>
                <svg class="dtz-arrow" viewBox="0 0 24 24" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
              </button>
              <input type="hidden" id="fsTz">
            </div>
          </div>

          <div class="field">
            <label for="fsEndDate">End</label>
            <div class="dt-box fs-dt-box">
              <input type="date" id="fsEndDate" aria-label="End date">
              <div class="sep" aria-hidden="true"></div>
              <input type="time" id="fsEndTime" aria-label="End time">
              <div class="sep" aria-hidden="true"></div>
              <button type="button" class="dtz-wrap" id="fsEndTzBtn" aria-label="End timezone" title="End timezone">
                <span class="dtz-badge" id="fsEndTzBadge" aria-hidden="true">TZ</span>
                <svg class="dtz-arrow" viewBox="0 0 24 24" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
              </button>
              <input type="hidden" id="fsEndTz">
            </div>
          </div>

          <div id="fsTzPreview" class="tz-info-banner" hidden></div>
        </div>
      </div>

      <!-- Details & Cost Card -->
      <div class="fs-group">
        <h3 class="fs-group-label">Details</h3>
        <div class="fs-card fs-details-card">
          <div class="cost-currency-box">
            <label class="field" style="flex:1;min-width:0">
              <span>Cost</span>
              <input id="fsCost" type="number" min="0" step="any" placeholder="0">
            </label>
            <label class="field" style="width:104px;flex-shrink:0">
              <span>Currency</span>
              <select id="fsCurrency">
                <option value="USD">USD</option>
                <option value="EUR">EUR</option>
                <option value="GBP">GBP</option>
                <option value="ILS">ILS</option>
              </select>
            </label>
          </div>

          <label class="field">
            <span>Notes</span>
            <textarea id="fsNotes" maxlength="1000" rows="4" placeholder="Address, booking reference, details..."></textarea>
          </label>
        </div>
      </div>
    </div>
  </form>
</dialog>

<dialog id="ratesDialog" class="small" aria-labelledby="ratesTitle" aria-modal="true">
  <form id="ratesForm">
    <div class="dlg-head"><h2 id="ratesTitle">Budget &amp; exchange rates</h2><button type="button" class="icon-btn" data-close aria-label="Close"><svg class="i" aria-hidden="true"><use href="#i-x"/></svg></button></div>
    <div class="dlg-body">
      <label class="field"><span>Base display currency</span>
        <select id="ratesBase">
          <option value="USD">USD ($)</option>
          <option value="EUR">EUR (€)</option>
          <option value="ILS">ILS (₪)</option>
          <option value="GBP">GBP (£)</option>
        </select>
      </label>
      <p class="muted" style="font-size:12px">Units per 1 USD (used to calculate combined budget total):</p>
      <div class="row2">
        <label class="field"><span>EUR per 1 USD</span><input id="rateEUR" type="number" min="0.0001" step="any"></label>
        <label class="field"><span>GBP per 1 USD</span><input id="rateGBP" type="number" min="0.0001" step="any"></label>
      </div>
      <label class="field"><span>ILS per 1 USD</span><input id="rateILS" type="number" min="0.0001" step="any"></label>
    </div>
    <div class="dlg-foot">
      <button type="button" class="btn" data-close>Cancel</button>
      <button type="submit" class="btn primary">Save rates</button>
    </div>
  </form>
</dialog>

<dialog id="confirmDialog" class="small" aria-labelledby="confirmTitle" aria-modal="true">
  <form method="dialog">
    <div class="dlg-body"><h2 id="confirmTitle" style="font-size:17px">Delete?</h2><p id="confirmText"></p></div>
    <div class="dlg-foot">
      <button class="btn" value="cancel" id="confirmCancel">Cancel</button>
      <button class="btn danger-solid" value="ok" id="confirmOk">Delete</button>
    </div>
  </form>
</dialog>

<dialog id="tripDialog" class="small" aria-labelledby="tripTitle" aria-modal="true">
  <form id="tripForm">
    <div class="dlg-head">
      <h2 id="tripTitle">Add trip</h2>
      <button type="button" class="icon-btn" data-close aria-label="Close">
        <svg class="i" aria-hidden="true"><use href="#i-x"/></svg>
      </button>
    </div>
    <div class="dlg-body">
      <input type="hidden" id="tripId">
      <label class="field">
        <span>Trip name</span>
        <input id="tripName" type="text" placeholder="e.g. Summer Vacation" required maxlength="100">
      </label>
      <div class="row2">
        <label class="field">
          <span>Start date</span>
          <input id="tripStartDate" type="date" required>
        </label>
        <label class="field">
          <span>End date (optional)</span>
          <input id="tripEndDate" type="date">
        </label>
      </div>
      <p class="muted" style="font-size:12px;margin-top:6px">End date is optional and can be set or changed later.</p>
    </div>
    <div class="dlg-foot">
      <button type="button" class="btn" data-close>Cancel</button>
      <button type="submit" class="btn primary" id="tripSubmit">Save trip</button>
    </div>
  </form>
</dialog>

<dialog id="timezoneDialog" class="small tz-dialog" aria-labelledby="tzDialogTitle" aria-modal="true">
  <form id="timezoneForm" onsubmit="event.preventDefault()">
    <div class="dlg-head">
      <h2 id="tzDialogTitle">Select timezone</h2>
      <button type="button" class="icon-btn" data-close aria-label="Close">
        <svg class="i" aria-hidden="true"><use href="#i-x"/></svg>
      </button>
    </div>
    <div class="tz-search-header">
      <div class="tz-search-box">
        <svg class="i sm tz-search-icon" aria-hidden="true"><use href="#i-search"/></svg>
        <input type="search" id="tzSearchInput" class="tz-search-input" placeholder="Search country or city..." autocomplete="off" spellcheck="false" aria-label="Search country or city" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-haspopup="listbox" aria-controls="tzResultsList">
        <button type="button" class="icon-btn sm tz-search-clear" id="tzSearchClear" aria-label="Clear search" hidden>
          <svg class="i sm" aria-hidden="true"><use href="#i-x"/></svg>
        </button>
      </div>
    </div>
    <div class="tz-body">
      <div class="tz-results-list" id="tzResultsList" role="listbox" aria-label="Timezones"></div>
      <p class="tz-empty-msg muted" id="tzEmptyMsg" hidden>No matching timezones found</p>
    </div>
    <div class="dlg-foot">
      <button type="button" class="btn" data-close id="tzCancelBtn">Cancel</button>
    </div>
  </form>
</dialog>

<dialog id="packItemDialog" class="fs-item-dialog" aria-labelledby="packDialogTitle" aria-modal="true">
  <form id="packItemForm" novalidate autocomplete="off">
    <div class="fs-header">
      <button type="button" class="icon-btn" data-close id="packClose" aria-label="Close dialog" title="Close"><svg class="i" aria-hidden="true"><use href="#i-x"/></svg></button>
      <div class="fs-handle" aria-hidden="true"></div>
      <h2 id="packDialogTitle" class="sr-only">Add packing item</h2>
      <div class="fs-header-actions" id="packHeaderActions">
        <button type="button" class="icon-btn danger" id="packItemDelete" aria-label="Delete item" title="Delete item" hidden><svg class="i" aria-hidden="true"><use href="#i-trash"/></svg></button>
        <button type="submit" class="fs-save-btn" id="packItemSubmit">Save</button>
      </div>
    </div>

    <div class="fs-body" id="packEditBody">
      <input type="hidden" id="packItemId">

      <!-- Single Main Card: Title, Category, Location, Quantity, Notes, To Buy -->
      <div class="fs-card fs-hero-card">
        <!-- Title Row with Round Packed Checkbox -->
        <div class="fs-title-wrap pack-title-row">
          <label class="pack-check-circle" id="packDoneLabel" aria-label="Mark packed" title="Mark packed">
            <input type="checkbox" id="packItemDone" name="packItemDone" class="sr-only">
            <svg class="i sm" aria-hidden="true"><use href="#i-check"/></svg>
          </label>
          <label for="packItemTitle" class="sr-only">Item title</label>
          <input id="packItemTitle" class="fs-title-input" required maxlength="200" autocomplete="off" placeholder="Add item name..." aria-label="Item title">
        </div>
        <div class="fs-card-divider" aria-hidden="true"></div>

        <!-- Category Pillchooser -->
        <div class="fs-chip-section">
          <span class="fs-label">Category</span>
          <div class="chips" id="packCategories" role="radiogroup" aria-label="Category"></div>
        </div>

        <div class="fs-card-divider" aria-hidden="true"></div>

        <!-- Location Pillchooser -->
        <div class="fs-chip-section">
          <span class="fs-label">Location</span>
          <div class="chips" id="packBags" role="radiogroup" aria-label="Location"></div>
        </div>

        <div class="fs-card-divider" aria-hidden="true"></div>

        <!-- Quantity Field -->
        <div class="fs-field-section">
          <label class="fs-label" for="packItemQty">Quantity</label>
          <div class="pack-qty-control">
            <button type="button" class="pack-qty-btn" id="packQtyDec" aria-label="Decrease quantity">−</button>
            <input type="number" id="packItemQty" min="1" max="99" value="1" inputmode="numeric" aria-label="Quantity">
            <button type="button" class="pack-qty-btn" id="packQtyInc" aria-label="Increase quantity">+</button>
          </div>
        </div>

        <div class="fs-card-divider" aria-hidden="true"></div>

        <!-- Notes Field (5 lines) -->
        <div class="fs-field-section">
          <label class="fs-label" for="packItemNotes">Notes</label>
          <textarea id="packItemNotes" rows="5" maxlength="500" placeholder="Size, brand, store, or packing reminder..."></textarea>
        </div>

        <div class="fs-card-divider" aria-hidden="true"></div>

        <!-- To buy Toggle (last on the form) -->
        <div class="fs-chip-section">
          <div class="chips" id="packStatusChips" aria-label="Item flags">
            <label class="chip-opt chip-toggle" id="packToBuyChip" style="--c: var(--pack-tobuy);">
              <input type="checkbox" id="packItemToBuy" name="packItemToBuy">
              <span><svg class="i" aria-hidden="true"><use href="#i-tag"/></svg>To buy</span>
            </label>
          </div>
        </div>
      </div>
    </div>
  </form>
</dialog>
</template>

<script>
  if ("serviceWorker" in navigator) {
    let refreshing = false;
    navigator.serviceWorker.addEventListener("controllerchange", () => {
      if (!refreshing) {
        refreshing = true;
        window.location.reload();
      }
    });

    navigator.serviceWorker.register("./service-worker.js", { scope: "./" })
      .then(reg => {
        reg.update();
      })
      .catch(error => console.error("Offline support could not be enabled:", error));
  }
</script>

</body>
</html>
